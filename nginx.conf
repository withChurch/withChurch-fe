# 1. 원래 있던 메인 서비스 블록 (이 블록을 가장 위로 올리고 default_server로 지정)
server {
    listen 80 default_server;
    server_name withchurch.site;

    # AWS ALB 환경 핵심: 원래 요청이 http였다면 https로 안전하게 리다이렉트
    if ($http_x_forwarded_proto = 'http') {
        return 301 https://withchurch.site$request_uri;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;

        # HTML 캐시 방지 (그대로 유지)
        if ($request_filename ~* \.(html|htm)$) {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires 0;
        }
    }
}

# 2. www.withchurch.site 로 들어오는 요청을 https://withchurch.site 로 리다이렉트
server {
    listen 80;
    server_name www.withchurch.site;

    return 301 https://withchurch.site$request_uri;
}