# 1. www.withchurch.site 로 들어오는 요청을 https://withchurch.site 로 리다이렉트
server {
    listen 80;
    server_name www.withchurch.site;
    return 301 https://withchurch.site$request_uri;
}

# 2. 원래 있던 메인 서비스 블록
server {
    listen 80;
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;

        # 핵심 추가 부분: HTML 파일은 절대 브라우저에 캐시하지 않도록 강제
        if ($request_filename ~* \.(html|htm)$) {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires 0;
        }
    }
}